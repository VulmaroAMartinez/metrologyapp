[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "T20"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]
"proxytests/**" = ["S101", "S310"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
# proxytests/ requiere el stack real: se ejecuta con `make test-proxy`.
testpaths = ["apps", "config"]
addopts = "--ds=config.settings.test --durations=10 -p no:cacheprovider --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/tests/*", "config/wsgi.py"]
