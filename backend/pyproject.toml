[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "DJ", "T20"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101", "S105", "S106"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
python_files = ["test_*.py"]
addopts = "-p no:cacheprovider --cov=apps --cov=config --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
omit = ["*/tests/*", "config/wsgi.py"]
