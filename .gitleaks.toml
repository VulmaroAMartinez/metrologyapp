title = "metrologyapp"

[extend]
useDefault = true

[[allowlists]]
description = "Plantilla sin secretos reales"
paths = ['''\.env\.example$''']

# Solo constantes con estos nombres, dentro de tests: no es una exención general de tests/.
[[allowlists]]
description = "Contraseñas de prueba (constantes de tests)"
condition = "AND"
regexTarget = "line"
paths = ['''backend/.*/tests/.*\.py$''']
regexes = ['''(DEFAULT_PASSWORD|SECRET)\s*=\s*"[^"]+"''']

# Falso positivo: pruebas que comprueban que NO se puede ordenar por columnas sensibles.
[[allowlists]]
description = "Parámetros de orden prohibidos en pruebas"
condition = "AND"
regexTarget = "line"
paths = ['''backend/apps/accounts/tests/test_usuarios_api\.py$''']
regexes = ['''orden=(password|intentos_fallidos)''']
